name: proyecto-civica-nba
version: '1.0.0'
profile: default

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]
clean-targets: ["target", "dbt_packages"]

# -----------------------------------------------------------------------------
# Variables de proyecto: reglas de negocio configurables sin tocar el SQL.
#   dbt build --vars '{long_trip_km: 2000}'
# -----------------------------------------------------------------------------
vars:
  season_start: 2013        # primera temporada del análisis (2013-14)
  season_end: 2022          # última temporada (2022-23)
  long_trip_km: 1500        # a partir de aquí un viaje se considera largo
  return_home_min_days: 5   # más de estos días entre partidos = el equipo vuelve a casa

# -----------------------------------------------------------------------------
# Modelos: configuración por carpeta (capa). Se hereda hacia abajo.
# -----------------------------------------------------------------------------
models:
  proyecto-civica-nba:
    +transient: false

    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['staging']
      kaggle:                 # una subcarpeta (y un schema) por fuente
        +schema: kaggle

    silver:                       # slv_: limpieza, corrección y deduplicación
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['silver']
      kaggle:
        +schema: kaggle

    gold:                         # consumo (Power BI)
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']
      intermediate:               # int_: lógica de apoyo
        +materialized: view
        +schema: intermediate
        +group: core
        +access: private          # solo la usan los modelos de su group
      core:                       # dim_ y fct_
        +schema: core
        +group: core
        +access: public           # cualquiera puede usarlos
      travel:                     # caso 1: impacto de los viajes
        +schema: travel
        +group: travel
        +access: public
      home_advantage:             # caso 2: ventaja de casa y público
        +schema: team_performance
        +group: team_performance
        +access: public

# -----------------------------------------------------------------------------
# Seeds: datos de referencia que creamos nosotras (pabellones, sedes neutrales)
# -----------------------------------------------------------------------------
seeds:
  proyecto-civica-nba:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    nba_arenas:
      +column_types:
        team_id: integer
        team_abbreviation: varchar(3)
        arena_name: varchar(100)
        latitude: number(9, 6)
        longitude: number(9, 6)
        timezone: varchar(50)
        date_from: date
        date_to: date

  