models:
  - name: dim_teams
    description: Los 30 equipos NBA con su nombre actual. Se usa dos veces, como equipo y como rival.
    config:
      contract:
        enforced: true
    columns:
      - name: team_id
        data_type: integer
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: team_abbreviation
        data_type: varchar
      - name: team_name
        data_type: varchar
      - name: team_nickname
        data_type: varchar
      - name: team_city
        data_type: varchar
      - name: team_state
        data_type: varchar

  - name: dim_arenas
    description: Pabellones con ubicación y huso (seed) y aforo (Kaggle).
    config:
      contract:
        enforced: true
    columns:
      - name: arena_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: arena_name
        data_type: varchar
      - name: latitude
        data_type: number(9, 6)
      - name: longitude
        data_type: number(9, 6)
      - name: timezone
        data_type: varchar
      - name: arena_capacity
        data_type: integer

  - name: dim_seasons
    description: Temporadas regulares del análisis.
    config:
      contract:
        enforced: true
    columns:
      - name: season_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: season_year
        data_type: integer
      - name: season_label
        data_type: varchar

  - name: dim_dates
    description: Un día por fila, para filtrar por año, trimestre, mes o día de la semana.
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: year
        data_type: integer
      - name: quarter
        data_type: integer
      - name: month
        data_type: integer
      - name: month_name
        data_type: varchar
      - name: day_of_week
        data_type: integer
      - name: day_name
        data_type: varchar
      - name: is_weekend
        data_type: boolean