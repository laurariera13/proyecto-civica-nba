seeds:
  - name: nba_arenas
    description: >
      Pabellón de cada equipo con su ubicación y huso horario, por periodos
      (algunos equipos se mudaron). La fila sin equipo es la burbuja de
      Orlando: sede neutral para todos entre esas fechas.
    columns:
      - name: team_id
        description: Vacío = sede neutral.
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_kaggle__teams')
                field: team_id
      - name: arena_name
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]
      - name: timezone
        data_tests: [not_null]
      - name: date_from
        data_tests: [not_null]